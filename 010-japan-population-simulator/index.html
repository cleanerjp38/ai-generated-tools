<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本の人口シミュレーター</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
    }

    .panel {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
    }

    canvas {
      width: 100%;
      height: 350px;
      background: white;
      border: 1px solid #ccc;
    }

    .note {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <h1>🇯🇵 日本の人口シミュレーター</h1>

  <div class="panel">

    <div class="input-group">
      <label for="population">現在の人口（万人）</label>
      <input id="population" type="number" value="12300">
    </div>

    <div class="input-group">
      <label for="fertility">合計特殊出生率</label>
      <input id="fertility" type="number" value="1.2" step="0.1">
    </div>

    <div class="input-group">
      <label for="immigration">年間の移民純流入数（万人）</label>
      <input id="immigration" type="number" value="10">
    </div>

    <div class="input-group">
      <label for="years">シミュレーション年数</label>
      <input id="years" type="number" value="50">
    </div>

    <button onclick="simulate()">シミュレーションする</button>

    <div id="result"></div>

    <p class="note">
      ※これは人口変化を単純化した教育用シミュレーターです。
      実際の人口推計とは異なります。
    </p>

  </div>

  <div class="panel">
    <canvas id="chart" width="800" height="350"></canvas>
  </div>

  <script>
    function simulate() {
      let population =
        Number(document.getElementById("population").value) * 10000;

      const fertility =
        Number(document.getElementById("fertility").value);

      const immigration =
        Number(document.getElementById("immigration").value) * 10000;

      const years =
        Number(document.getElementById("years").value);

      const startPopulation = population;

      const data = [population];

      /*
        簡易モデル

        出生率2.1を人口維持水準と仮定。
        出生率が2.1より低いほど人口減少率を大きくする。

        出生率2.1 → 自然増減 0%
        出生率1.2 → 約 -0.9% / 年

        ここに年間の移民純流入数を加える。
      */

      const naturalChangeRate = (fertility - 2.1) * 0.01;

      for (let year = 0; year < years; year++) {
        population =
          population * (1 + naturalChangeRate) + immigration;

        if (population < 0) {
          population = 0;
        }

        data.push(population);
      }

      const change =
        ((population - startPopulation) / startPopulation) * 100;

      document.getElementById("result").innerHTML =
        `${years}年後の人口：約${formatPopulation(population)}万人<br>` +
        `現在比：${change.toFixed(1)}%`;

      drawChart(data);
    }

    function formatPopulation(population) {
      return Math.round(population / 10000).toLocaleString();
    }

    function drawChart(data) {
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");

      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      const padding = 50;

      const maxPopulation = Math.max(...data);

      // 軸
      ctx.beginPath();
      ctx.moveTo(padding, 20);
      ctx.lineTo(padding, height - padding);
      ctx.lineTo(width - 20, height - padding);
      ctx.stroke();

      // 人口推移
      ctx.beginPath();

      data.forEach((population, index) => {
        const x =
          padding +
          (index / (data.length - 1)) *
          (width - padding - 20);

        const y =
          height -
          padding -
          (population / maxPopulation) *
          (height - padding - 30);

        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });

      ctx.strokeStyle = "blue";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = "black";
      ctx.font = "14px sans-serif";

      ctx.fillText("現在", padding, height - 20);
      ctx.fillText(
        `${data.length - 1}年後`,
        width - 80,
        height - 20
      );

      ctx.fillText(
        `${Math.round(maxPopulation / 10000).toLocaleString()}万人`,
        5,
        30
      );
    }

    simulate();
  </script>

</body>
</html>
